# 볼탱이 대전 (/battle/, /api/battle/*) Nginx 리버스 프록시 설정 스니펫
# 기존 Grow 앱(/grow/, /api/grow/*, 127.0.0.1:3101)과 경로/포트가 완전히 분리되어 있음

# /etc/nginx/snippets/boltaengi-battle.conf 또는 기존 server 블록 내부에 include
location = /battle {
    return 301 /battle/;
}

location ^~ /battle/ {
    proxy_pass http://127.0.0.1:8791/battle/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # HTML/초기 진입점은 항상 최신 버전 유지
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /api/battle/ {
    proxy_pass http://127.0.0.1:8791/api/battle/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 실시간 방/계정/보상 API 응답은 절대 캐시하지 않음
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 바디 크기 및 타임아웃 제한 (1GB Lightsail 보호)
    client_max_body_size 16k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 10s;

    # 공급자의 일회용 인증 코드와 브라우저 연결 티켓은 접근 로그에서 제외한다.
    location ^~ /api/battle/auth/ {
        access_log off;
        proxy_pass http://127.0.0.1:8791;
    }
}
